on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: uv sync --dev
      - run: sudo apt-get install -y ripgrep
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
