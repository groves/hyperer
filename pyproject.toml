[project]
name = "hyperer"
version = "0.3.0"
description = "Injects hyperlinks into terminal commands"
authors = [{name = "Charlie Groves", email = "c@sevorg.org"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hyperer-cargo = "hyperer.cargo:main"
hyperer-rg = "hyperer.rg:main"
hyperer-ruff = "hyperer.ruff:main"

[project.urls]
Repository = "https://github.com/groves/hyperer"

[dependency-groups]
dev = [
    "pytest>=7.1.3",
    "ruff>=0.4.2",
]

[tool.ruff]
exclude = ['ruff_check_raiser.py']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
